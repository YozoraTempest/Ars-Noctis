name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Validate npm distribution
        run: npm run check

      - name: Validate trigger evaluations
        run: python scripts/validate_evals.py

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Ars tests
        run: python -m unittest discover -s skills/ars/tests -p "test_*.py" -v

      - name: Run Noctis tests
        run: python -m unittest discover -s skills/noctis/tests -p "test_*.py" -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Validate npm distribution
        run: npm run check

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Ars tests
        run: python -m unittest discover -s skills/ars/tests -p "test_*.py" -v

      - name: Run Noctis tests
        run: python -m unittest discover -s skills/noctis/tests -p "test_*.py" -v
