version: 1
kind: ars
name: implement
role: executor
state:
  mode: documents
capabilities:
  - id: fix-review
    contract: 1
    inputs:
      review:
        type: review-record
        formats:
          - ars.review@1
        required: true
    outputs:
      implementation:
        type: implementation-record
        formats:
          - ars.implementation@1
        required: true
    side_effects:
      - local-commit
      - project-write
      - task-record-write
  - id: fix-verification
    contract: 1
    inputs:
      verification:
        type: verification-record
        formats:
          - ars.verification@1
        required: true
    outputs:
      implementation:
        type: implementation-record
        formats:
          - ars.implementation@1
        required: true
    side_effects:
      - local-commit
      - project-write
      - task-record-write
  - id: implement
    contract: 1
    inputs: {}
    outputs:
      implementation:
        type: implementation-record
        formats:
          - ars.implementation@1
        required: true
    side_effects:
      - local-commit
      - project-write
      - task-record-write
supports: []
documents:
  - id: implementation
    contract: 1
    file: implementation.md
    template: assets/templates/implementation.md
    tool: scripts/implementation.py
augmentations: []
