version: 2
default_workflow: "reviewed"
executors:
  code-review:
    provider: "code-review"
    source: "manifest"
  implement:
    provider: "implement"
    source: "manifest"
  verify:
    provider: "verify"
    source: "manifest"
supports: {}
capabilities:
  fix:
    contract: 1
    executor: "implement"
    supports: {}
  implement:
    contract: 1
    executor: "implement"
    supports: {}
  review:
    contract: 1
    executor: "code-review"
    supports: {}
  verify:
    contract: 1
    executor: "verify"
    supports: {}
workflow_templates:
  reviewed:
    description: "默认工程修改"
    tasks:
      implement:
        capability: "implement"
        depends_on: []
      review:
        capability: "review"
        depends_on:
          - "implement"
  verified:
    description: "包含实际行为验收"
    tasks:
      implement:
        capability: "implement"
        depends_on: []
      review:
        capability: "review"
        depends_on:
          - "implement"
      verify:
        capability: "verify"
        depends_on:
          - "review"
