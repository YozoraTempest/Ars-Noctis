version: 3
default_workflow: "reviewed"
executors:
  code-review:
    provider: "code-review"
    source: "manifest"
  implement:
    provider: "implement"
    source: "manifest"
  verify:
    provider: "verify"
    source: "manifest"
supports: {}
capabilities:
  fix:
    contract: 1
    executor: "implement"
    supports: {}
    inputs: {}
    outputs:
      implementation:
        type: "implementation-record"
        formats:
          - "ars.implementation@1"
        required: true
    side_effects:
      - "project-write"
      - "local-commit"
      - "task-record-write"
  implement:
    contract: 1
    executor: "implement"
    supports: {}
    inputs: {}
    outputs:
      implementation:
        type: "implementation-record"
        formats:
          - "ars.implementation@1"
        required: true
    side_effects:
      - "project-write"
      - "local-commit"
      - "task-record-write"
  review:
    contract: 1
    executor: "code-review"
    supports: {}
    inputs:
      implementation:
        type: "implementation-record"
        formats:
          - "ars.implementation@1"
        required: false
    outputs:
      review:
        type: "review-record"
        formats:
          - "ars.review@1"
        required: true
    side_effects:
      - "review-record-write"
      - "local-checkpoint"
  verify:
    contract: 1
    executor: "verify"
    supports: {}
    inputs:
      review:
        type: "review-record"
        formats:
          - "ars.review@1"
        required: false
    outputs:
      verification:
        type: "verification-record"
        formats:
          - "ars.verification@1"
        required: true
    side_effects:
      - "behavior-verification"
      - "local-checkpoint"
      - "verification-record-write"
workflow_templates:
  reviewed:
    description: "默认工程修改"
    tasks:
      implement:
        capability: "implement"
        depends_on: []
        inputs: {}
      review:
        capability: "review"
        depends_on:
          - "implement"
        inputs:
          implementation: "implement.implementation"
  verified:
    description: "包含实际行为验收"
    tasks:
      implement:
        capability: "implement"
        depends_on: []
        inputs: {}
      review:
        capability: "review"
        depends_on:
          - "implement"
        inputs:
          implementation: "implement.implementation"
      verify:
        capability: "verify"
        depends_on:
          - "review"
        inputs:
          review: "review.review"
