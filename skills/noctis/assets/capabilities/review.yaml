version: 1
kind: capability
id: review
contract: 1
summary: 对 Task 登记的精确提交执行一次静态代码审查或定向修复复核。
entry:
  task_status: active
  capability: review
artifacts:
  inputs:
    implementation:
      type: implementation-record
      formats:
        - ars.implementation@1
      required: false
    implementations:
      type: implementation-record
      formats:
        - ars.implementation@1
      required: false
      cardinality: many
    reviews:
      type: review-record
      formats:
        - ars.review@1
      required: false
      cardinality: many
  outputs:
    review:
      type: review-record
      formats:
        - ars.review@1
      required: true
outcomes:
  - completed
  - spliced
  - deferred
  - blocked
allows:
  - review-record-write
  - orchestration-write
  - local-checkpoint
forbids:
  - project-write
  - test-execution
  - behavior-verification
  - push
  - deploy
