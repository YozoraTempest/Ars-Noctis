version: 1
kind: ars
name: noctis-exec
role: executor
state:
  mode: documents
capabilities:
  - id: discover-entries
    contract: 1
    inputs:
      orchestration:
        type: orchestration-record
        formats:
          - noctis.record@3
        required: false
    outputs:
      candidates:
        type: execution-entry-set
        formats:
          - noctis.execution-entry-set@1
        required: true
    side_effects: []
  - id: materialize-workflow
    contract: 1
    inputs:
      execution-plan:
        type: execution-plan
        formats:
          - noctis.execution-plan@2
        required: true
    outputs:
      orchestration:
        type: orchestration-record
        formats:
          - noctis.record@3
        required: true
    side_effects:
      - orchestration-write
  - id: execute-workflow
    contract: 1
    inputs:
      execution-entry:
        type: execution-entry
        formats:
          - noctis.execution-entry@2
        required: true
    outputs:
      orchestration:
        type: orchestration-record
        formats:
          - noctis.record@3
        required: true
    side_effects:
      - orchestration-write
supports: []
documents:
  - id: task-orchestration
    contract: 2
    file: noctis.md
    template: assets/templates/task.md
    tool: scripts/exec.py
  - id: unit-orchestration
    contract: 3
    file: noctis.md
    template: assets/templates/unit.md
    tool: scripts/exec.py
  - id: work-orchestration
    contract: 2
    file: noctis.md
    template: assets/templates/work.md
    tool: scripts/exec.py
augmentations: []
