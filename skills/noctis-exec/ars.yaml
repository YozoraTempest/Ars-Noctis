version: 1
kind: ars
name: noctis-exec
role: executor
state:
  mode: documents
capabilities:
  - id: start-workflow
    contract: 1
    inputs:
      execution-plan:
        type: execution-plan
        formats:
          - noctis.execution-plan@2
        required: true
    outputs: {}
    side_effects:
      - orchestration-write
  - id: resume-workflow
    contract: 1
    inputs:
      execution-entry:
        type: execution-entry
        formats:
          - noctis.execution-entry@2
        required: true
    outputs: {}
    side_effects:
      - orchestration-write
supports: []
documents:
  - id: task-orchestration
    contract: 2
    file: noctis.md
    template: assets/templates/task.md
    tool: scripts/exec.py
  - id: unit-orchestration
    contract: 3
    file: noctis.md
    template: assets/templates/unit.md
    tool: scripts/exec.py
  - id: work-orchestration
    contract: 2
    file: noctis.md
    template: assets/templates/work.md
    tool: scripts/exec.py
augmentations: []
