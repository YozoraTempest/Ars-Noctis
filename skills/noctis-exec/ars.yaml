  - id: unit-orchestration
    contract: 3
    file: noctis.md
    template: assets/templates/unit.md
    tool: scripts/exec.py
  - id: work-orchestration
    contract: 2
    file: noctis.md
    template: assets/templates/work.md
    tool: scripts/exec.py
augmentations: []
