version: 1
kind: ars
name: code-review
role: executor
state:
  mode: documents
capabilities:
  - id: review
    contract: 1
    inputs:
      implementation:
        type: implementation-record
        formats:
          - ars.implementation@1
        required: false
    outputs:
      review:
        type: review-record
        formats:
          - ars.review@1
        required: true
    side_effects:
      - local-checkpoint
      - review-record-write
supports: []
documents:
  - id: review
    contract: 1
    file: review.md
    template: assets/templates/review.md
    tool: scripts/review.py
augmentations: []
